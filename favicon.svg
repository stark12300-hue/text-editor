<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="pbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="pbDoc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="pbFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="pbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4f46e5" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle App Badge Container -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#pbBg)" filter="url(#pbGlow)"/>
  <rect x="2" y="2" width="44" height="44" rx="12" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.2"/>

  <!-- PDF Document Page with Folded Corner -->
  <path d="M12 9C10.8954 9 10 9.89543 10 11V37C10 38.1046 10.8954 39 12 39H36C37.1046 39 38 38.1046 38 37V19L28 9H12Z" fill="url(#pbDoc)"/>
  <!-- Folded Corner Flap -->
  <path d="M28 9V17C28 18.1046 28.8954 19 30 19H38L28 9Z" fill="url(#pbFold)"/>

  <!-- PDF Red Tab Badge -->
  <rect x="13" y="12" width="11" height="5" rx="1.5" fill="#ef4444"/>
  <text x="14.2" y="15.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="3.5" font-weight="900" fill="#ffffff" letter-spacing="0.3">PDF</text>

  <!-- Bapu's Iconic Round Wireframe Glasses (Spectacles) -->
  <!-- Left Lens -->
  <circle cx="18" cy="27" r="4.8" stroke="#0f172a" stroke-width="1.8" fill="rgba(6, 182, 212, 0.15)"/>
  <circle cx="17.2" cy="25.6" r="1.2" fill="#ffffff" opacity="0.85"/>
  <!-- Right Lens -->
  <circle cx="30" cy="27" r="4.8" stroke="#0f172a" stroke-width="1.8" fill="rgba(6, 182, 212, 0.15)"/>
  <circle cx="29.2" cy="25.6" r="1.2" fill="#ffffff" opacity="0.85"/>
  <!-- Bridge connecting the lenses -->
  <path d="M22.8 26C23.5 24.8 24.5 24.8 25.2 26" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- Temples (Frame Sides) -->
  <path d="M13.2 26.2L11 25.4" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M34.8 26.2L37 25.4" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Smart Edit Pen Sparkle Accent -->
  <circle cx="33" cy="33.5" r="1.6" fill="#10b981"/>
  <path d="M31 35H17" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2"/>
</svg>
